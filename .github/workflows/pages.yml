name: Deploy Pantry Index to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate calculations and catalog
        run: |
          node --test tests/*.test.cjs
          node scripts/audit-catalog.mjs
          node --check app.js
          node --check menu.js

      - name: Set up Python for browser walkthroughs
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python - <<'PYTHON'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p, open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'CHROMIUM_PATH={p.chromium.executable_path}\n')
          PYTHON

      - name: Walk through desktop and mobile UI
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/pantry-http.log 2>&1 &
          site_pid=$!
          trap 'kill "$site_pid"' EXIT
          python - <<'PYTHON'
          import time
          import urllib.request
          for attempt in range(50):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/') as response:
                      assert response.status == 200
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise RuntimeError('Static server did not become ready')
          PYTHON
          python tests/browser_smoke.py
          python tests/menu_walkthrough.py http://127.0.0.1:8000
          python tests/browser_walkthrough.py
          python tests/audit_walkthrough.py
          python tests/cross_browser.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
